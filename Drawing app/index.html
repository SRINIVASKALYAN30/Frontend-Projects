<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Drawing App</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="script.js" defer></script>
</head>

<body>

<div class="app">

  <!-- Sidebar -->
  <section class="tools-board">
    <h2>🎨 Tools</h2>

    <div class="row">
      <label>Shapes</label>
      <ul class="options">
        <li class="option tool" id="rectangle">⬛ Rectangle</li>
        <li class="option tool" id="circle">⚪ Circle</li>
        <li class="option tool" id="triangle">🔺 Triangle</li>
        <li class="option">
          <input type="checkbox" id="fill-color">
          <label for="fill-color">Fill</label>
        </li>
      </ul>
    </div>

    <div class="row">
      <label>Tools</label>
      <ul class="options">
        <li class="option active tool" id="brush">🖌 Brush</li>
        <li class="option tool" id="eraser">🧽 Eraser</li>
        <li class="option">
          <input type="range" id="size-slider" min="1" max="30" value="5">
        </li>
      </ul>
    </div>

    <div class="row colors">
      <label>Colors</label>
      <ul class="options">
        <li class="option"></li>
        <li class="option selected"></li>
        <li class="option"></li>
        <li class="option"></li>
        <li class="option">
          <input type="color" id="color-picker">
        </li>
      </ul>
    </div>

    <div class="row buttons">
      <button class="clear-canvas">Clear</button>
      <button class="save-img">Save</button>
    </div>
  </section>

  <!-- FULL SCREEN CANVAS -->
  <section class="drawing-board">
    <canvas></canvas>
  </section>

</div>

</body>
</html>
